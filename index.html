<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ten Seconds Game</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #f4f0e8;
        color: #111111;
        font-family: Impact, Haettenschweiler, "Arial Black", "Franklin Gothic Heavy", sans-serif;
        user-select: none;
      }

      @media (pointer: fine) {
        body,
        button {
          cursor: none;
        }
      }

      .board {
        --cell-size: 84px;
        position: fixed;
        inset: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cell-size));
        grid-template-rows: repeat(var(--rows), var(--cell-size));
        justify-content: center;
        align-content: center;
        background: #f4f0e8;
      }

      .cell {
        appearance: none;
        width: var(--cell-size);
        height: var(--cell-size);
        margin: 0;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1px solid rgba(17, 17, 17, 0.18);
        background: rgba(244, 240, 232, 0.82);
        color: #111111;
        cursor: default;
        font-size: calc(var(--cell-size) * 0.62);
        font-weight: 900;
        line-height: 1;
        text-transform: uppercase;
        touch-action: manipulation;
      }

      .cell.hot {
        cursor: pointer;
        background: #111111;
        color: #f4f0e8;
        font-family: Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif;
        font-size: calc(var(--cell-size) * 0.72);
        transform: scale(1.06);
        z-index: 1;
      }

      .cell.locked {
        background: rgba(244, 240, 232, 0.82);
        border-color: rgba(17, 17, 17, 0.18);
        color: #111111;
        font-family: Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif;
        font-size: calc(var(--cell-size) * 0.68);
      }

      .hud {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: rgba(17, 17, 17, 0.62);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        pointer-events: none;
        text-transform: uppercase;
      }

      .instructions {
        position: fixed;
        left: 50%;
        bottom: 38px;
        transform: translateX(-50%);
        width: min(90vw, 620px);
        color: rgba(17, 17, 17, 0.42);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        pointer-events: none;
        text-align: center;
        text-transform: uppercase;
      }

      .instructions.hidden {
        display: none;
      }

      .hand-cursor {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 10;
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        font-family: Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif;
        font-size: 42px;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transform: translate3d(var(--hand-x, 50vw), var(--hand-y, 50vh), 0) translate(-28%, -18%) rotate(-22deg);
        transform-origin: 34% 70%;
        transition: opacity 120ms ease;
      }

      .hand-cursor.visible {
        opacity: 1;
      }

      .hand-cursor.smacking {
        animation: smack 180ms cubic-bezier(0.2, 0.9, 0.2, 1);
      }

      @keyframes smack {
        0% {
          transform: translate3d(var(--hand-x), var(--hand-y), 0) translate(-34%, -42%) rotate(-42deg) scale(1.08);
        }

        62% {
          transform: translate3d(var(--hand-x), var(--hand-y), 0) translate(-18%, -4%) rotate(5deg) scale(0.9);
        }

        100% {
          transform: translate3d(var(--hand-x), var(--hand-y), 0) translate(-28%, -18%) rotate(-22deg) scale(1);
        }
      }

      @media (max-width: 640px) {
        .board {
          --cell-size: 64px;
        }

        .hud {
          font-size: 10px;
        }

        .instructions {
          bottom: 34px;
          font-size: 10px;
        }

        .hand-cursor {
          width: 46px;
          height: 46px;
          font-size: 36px;
        }
      }
    </style>
  </head>
  <body>
    <main class="board" id="board" aria-label="What part of this is shit?"></main>
    <div class="instructions" id="instructions" aria-hidden="true">What part of this is shit?</div>
    <div class="hud" aria-hidden="true">
      <span id="stage">stage 1</span>
      <span id="progress">0 / 0</span>
    </div>
    <div class="hand-cursor" id="handCursor" aria-hidden="true">👋</div>

    <script>
      const sentence = "That only took 10 seconds to create. That's not the future, that's right now.";
      const board = document.querySelector("#board");
      const handCursor = document.querySelector("#handCursor");
      const instructions = document.querySelector("#instructions");
      const stageLabel = document.querySelector("#stage");
      const progressLabel = document.querySelector("#progress");
      const isSmallScreen = () => window.matchMedia("(max-width: 640px)").matches;
      const stageOneSize = () => isSmallScreen() ? 52 : 76;
      const stageTwoSize = () => isSmallScreen() ? 46 : 66;

      let stage = 1;
      let cellSize = stageTwoSize();
      let cells = [];
      let hotIndex = -1;
      let spawnTimer = 0;
      let revertTimer = 0;
      let audioContext;

      function letterFor(index) {
        const compact = sentence.replace(/\s/g, "");
        return compact[index % compact.length];
      }

      function buildStage() {
        clearTimeout(spawnTimer);
        clearTimeout(revertTimer);
        hotIndex = -1;

        const stageCellSize = stage === 1 ? stageOneSize() : cellSize;
        const cols = Math.max(1, Math.floor(window.innerWidth / stageCellSize));
        const rows = Math.max(1, Math.floor(window.innerHeight / stageCellSize));
        const total = cols * rows;

        instructions.classList.toggle("hidden", stage !== 1);
        board.style.setProperty("--cell-size", `${stageCellSize}px`);
        board.style.setProperty("--cols", cols);
        board.style.setProperty("--rows", rows);
        board.replaceChildren();

        cells = Array.from({ length: total }, (_, index) => {
          const cell = document.createElement("button");
          cell.className = "cell";
          cell.type = "button";
          cell.dataset.index = String(index);
          cell.dataset.letter = letterFor(index);
          cell.textContent = cell.dataset.letter;
          cell.addEventListener("pointerdown", claimCell);
          board.append(cell);
          return {
            el: cell,
            locked: false,
            letter: cell.dataset.letter,
          };
        });

        updateHud();
        schedulePoop(650);
      }

      function schedulePoop(delay = randomBetween(900, 1900)) {
        clearTimeout(spawnTimer);
        spawnTimer = setTimeout(spawnPoop, delay);
      }

      function spawnPoop() {
        const available = cells
          .map((cell, index) => (cell.locked ? -1 : index))
          .filter((index) => index >= 0);

        if (!available.length) {
          finishStage();
          return;
        }

        hotIndex = available[Math.floor(Math.random() * available.length)];
        const cell = cells[hotIndex];
        cell.el.classList.add("hot");
        cell.el.textContent = "💩";

        clearTimeout(revertTimer);
        revertTimer = setTimeout(revertHotCell, randomBetween(850, 1450));
      }

      function revertHotCell() {
        if (hotIndex < 0) {
          return;
        }

        const cell = cells[hotIndex];
        if (!cell.locked) {
          cell.el.classList.remove("hot");
          cell.el.textContent = cell.letter;
          playBuzz();
        }

        hotIndex = -1;
        schedulePoop();
      }

      function claimCell(event) {
        primeAudio();
        const index = Number(event.currentTarget.dataset.index);
        if (index !== hotIndex || cells[index].locked) {
          playBuzz();
          return;
        }

        clearTimeout(revertTimer);
        cells[index].locked = true;
        cells[index].el.classList.remove("hot");
        cells[index].el.classList.add("locked");
        cells[index].el.textContent = "💩";
        hotIndex = -1;
        playPlop();
        updateHud();

        if (cells.every((cell) => cell.locked)) {
          finishStage();
          return;
        }

        schedulePoop(randomBetween(280, 900));
      }

      function finishStage() {
        clearTimeout(spawnTimer);
        clearTimeout(revertTimer);
        stage += 1;
        cellSize = stage === 2 ? stageTwoSize() : Math.max(6, Math.floor(cellSize * 0.82));
        window.setTimeout(buildStage, 850);
      }

      function updateHud() {
        const locked = cells.filter((cell) => cell.locked).length;
        stageLabel.textContent = `stage ${stage}`;
        progressLabel.textContent = `${locked} / ${cells.length}`;
      }

      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function primeAudio() {
        audioContext ||= new (window.AudioContext || window.webkitAudioContext)();

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }
      }

      function playPlop() {
        if (!audioContext) {
          return;
        }

        const now = audioContext.currentTime;
        const master = audioContext.createGain();
        const impact = audioContext.createOscillator();
        const body = audioContext.createOscillator();
        const filter = audioContext.createBiquadFilter();
        const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.12, audioContext.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);
        const noise = audioContext.createBufferSource();

        for (let i = 0; i < noiseData.length; i += 1) {
          noiseData[i] = (Math.random() * 2 - 1) * (1 - i / noiseData.length);
        }

        noise.buffer = noiseBuffer;

        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.34, now + 0.012);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(360, now);
        filter.frequency.exponentialRampToValueAtTime(92, now + 0.22);
        filter.Q.setValueAtTime(2.4, now);

        impact.type = "triangle";
        impact.frequency.setValueAtTime(210, now);
        impact.frequency.exponentialRampToValueAtTime(54, now + 0.18);

        body.type = "sine";
        body.frequency.setValueAtTime(82, now);
        body.frequency.exponentialRampToValueAtTime(38, now + 0.25);

        impact.connect(filter);
        body.connect(filter);
        noise.connect(filter);
        filter.connect(master);
        master.connect(audioContext.destination);

        impact.start(now);
        body.start(now + 0.018);
        noise.start(now);
        impact.stop(now + 0.22);
        body.stop(now + 0.3);
        noise.stop(now + 0.12);
      }

      function playBuzz() {
        if (!audioContext) {
          return;
        }

        const now = audioContext.currentTime;
        const master = audioContext.createGain();
        const oscillator = audioContext.createOscillator();
        const wobble = audioContext.createOscillator();
        const wobbleGain = audioContext.createGain();
        const filter = audioContext.createBiquadFilter();
        const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.38, audioContext.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);
        const noise = audioContext.createBufferSource();

        for (let i = 0; i < noiseData.length; i += 1) {
          const fade = 1 - i / noiseData.length;
          noiseData[i] = (Math.random() * 2 - 1) * fade * 0.55;
        }

        noise.buffer = noiseBuffer;

        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.28, now + 0.025);
        master.gain.setValueAtTime(0.22, now + 0.12);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(260, now);
        filter.frequency.linearRampToValueAtTime(150, now + 0.36);
        filter.Q.setValueAtTime(5, now);

        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(72, now);
        oscillator.frequency.linearRampToValueAtTime(48, now + 0.34);

        wobble.type = "square";
        wobble.frequency.setValueAtTime(22, now);
        wobbleGain.gain.setValueAtTime(16, now);

        wobble.connect(wobbleGain);
        wobbleGain.connect(oscillator.frequency);
        oscillator.connect(filter);
        noise.connect(filter);
        filter.connect(master);
        master.connect(audioContext.destination);

        wobble.start(now);
        oscillator.start(now);
        noise.start(now);
        wobble.stop(now + 0.43);
        oscillator.stop(now + 0.43);
        noise.stop(now + 0.38);
      }

      function moveHand(x, y) {
        handCursor.style.setProperty("--hand-x", `${x}px`);
        handCursor.style.setProperty("--hand-y", `${y}px`);
        handCursor.classList.add("visible");
      }

      function smackHand(x, y) {
        moveHand(x, y);
        handCursor.classList.remove("smacking");
        void handCursor.offsetWidth;
        handCursor.classList.add("smacking");
      }

      window.addEventListener("pointermove", (event) => {
        moveHand(event.clientX, event.clientY);
      });

      window.addEventListener("pointerdown", (event) => {
        smackHand(event.clientX, event.clientY);
      }, { capture: true });

      window.addEventListener("resize", () => {
        buildStage();
      });

      buildStage();
    </script>
  </body>
</html>
