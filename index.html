<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ten Seconds Game</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #f4f0e8;
        color: #111111;
        font-family: Impact, Haettenschweiler, "Arial Black", "Franklin Gothic Heavy", sans-serif;
        user-select: none;
      }

      .board {
        --cell-size: 84px;
        position: fixed;
        inset: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cell-size));
        grid-template-rows: repeat(var(--rows), var(--cell-size));
        justify-content: center;
        align-content: center;
        background: #f4f0e8;
      }

      .cell {
        appearance: none;
        width: var(--cell-size);
        height: var(--cell-size);
        margin: 0;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1px solid rgba(17, 17, 17, 0.18);
        background: rgba(244, 240, 232, 0.82);
        color: #111111;
        cursor: default;
        font-size: calc(var(--cell-size) * 0.62);
        font-weight: 900;
        line-height: 1;
        text-transform: uppercase;
        touch-action: manipulation;
      }

      .cell.hot {
        cursor: pointer;
        background: #111111;
        color: #f4f0e8;
        font-family: Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif;
        font-size: calc(var(--cell-size) * 0.72);
        transform: scale(1.06);
        z-index: 1;
      }

      .cell.locked {
        background: rgba(244, 240, 232, 0.82);
        border-color: rgba(17, 17, 17, 0.18);
        color: #111111;
        font-family: Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif;
        font-size: calc(var(--cell-size) * 0.68);
      }

      .cell.blank {
        color: transparent;
      }

      .cell.blank.hot,
      .cell.blank.locked {
        color: #111111;
      }

      .hud {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: rgba(17, 17, 17, 0.62);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        pointer-events: none;
        text-transform: uppercase;
      }

      .instructions {
        position: fixed;
        left: 50%;
        bottom: 38px;
        transform: translateX(-50%);
        width: min(90vw, 620px);
        color: rgba(17, 17, 17, 0.42);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        pointer-events: none;
        text-align: center;
        text-transform: uppercase;
      }

      .instructions.hidden {
        display: none;
      }

      .break-overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        overflow: hidden;
        pointer-events: none;
      }

      .break-overlay.hidden {
        display: none;
      }

      .break-text {
        grid-area: 1 / 1;
        color: hsl(var(--hue), 95%, 54%);
        font-size: clamp(4rem, 18vw, 16rem);
        font-weight: 900;
        line-height: 0.82;
        opacity: 0.86;
        text-align: center;
        text-transform: uppercase;
        transform: translate(var(--x), var(--y)) rotate(var(--r));
        animation: flash 260ms steps(1, end) infinite;
        mix-blend-mode: multiply;
      }

      .break-text:nth-child(1) {
        --hue: 0;
        --x: -5vw;
        --y: -4vh;
        --r: -8deg;
      }

      .break-text:nth-child(2) {
        --hue: 56;
        --x: 5vw;
        --y: 4vh;
        --r: 6deg;
        animation-delay: 55ms;
      }

      .break-text:nth-child(3) {
        --hue: 132;
        --x: -1vw;
        --y: 7vh;
        --r: -2deg;
        animation-delay: 110ms;
      }

      .break-text:nth-child(4) {
        --hue: 210;
        --x: 4vw;
        --y: -7vh;
        --r: 10deg;
        animation-delay: 165ms;
      }

      .break-text:nth-child(5) {
        --hue: 294;
        --x: -7vw;
        --y: 2vh;
        --r: 3deg;
        animation-delay: 220ms;
      }

      @keyframes flash {
        0%,
        100% {
          opacity: 0.08;
        }

        50% {
          opacity: 0.92;
        }
      }

      @media (max-width: 640px) {
        .board {
          --cell-size: 64px;
        }

        .hud {
          font-size: 10px;
        }

        .instructions {
          bottom: 34px;
          font-size: 10px;
        }

      }
    </style>
  </head>
  <body>
    <main class="board" id="board" aria-label="What part of this is shit?"></main>
    <div class="instructions" id="instructions" aria-hidden="true">What part of this is shit?</div>
    <div class="hud" aria-hidden="true">
      <span id="stage">stage 1</span>
      <span id="progress">0 / 0</span>
    </div>
    <div class="break-overlay hidden" id="breakOverlay" aria-hidden="true">
      <div class="break-text">full of shit</div>
      <div class="break-text">full of shit</div>
      <div class="break-text">full of shit</div>
      <div class="break-text">full of shit</div>
      <div class="break-text">full of shit</div>
    </div>

    <script>
      const sentence = "That only took 10 seconds to create. That's not the future, that's right now.";
      const board = document.querySelector("#board");
      const breakOverlay = document.querySelector("#breakOverlay");
      const instructions = document.querySelector("#instructions");
      const stageLabel = document.querySelector("#stage");
      const progressLabel = document.querySelector("#progress");
      const fartSound = new Audio("assets/fart.mp3");
      const dripSound = new Audio("assets/drip.mp3");
      const isSmallScreen = () => window.matchMedia("(max-width: 640px)").matches;
      const stageOneSize = () => isSmallScreen() ? 52 : 76;
      const stageTwoSize = () => isSmallScreen() ? 46 : 66;

      let stage = 1;
      let cellSize = stageTwoSize();
      let cells = [];
      let hotIndex = -1;
      let spawnTimer = 0;
      let revertTimer = 0;
      let isBetweenStages = false;

      function buildStage() {
        clearTimeout(spawnTimer);
        clearTimeout(revertTimer);
        hotIndex = -1;

        const stageChars = charsForStage();
        const stageCellSize = sizeForStage(stageChars.length);
        const cols = Math.max(1, Math.floor(window.innerWidth / stageCellSize));
        const rows = Math.ceil(stageChars.length / cols);

        instructions.classList.toggle("hidden", stage !== 1);
        board.style.setProperty("--cell-size", `${stageCellSize}px`);
        board.style.setProperty("--cols", cols);
        board.style.setProperty("--rows", rows);
        board.replaceChildren();

        cells = stageChars.map((character, index) => {
          const cell = document.createElement("button");
          cell.className = "cell";
          cell.type = "button";
          cell.dataset.index = String(index);
          cell.dataset.letter = character;
          cell.classList.toggle("blank", character === " ");
          cell.textContent = character === " " ? "" : character;
          cell.addEventListener("pointerdown", claimCell);
          board.append(cell);
          return {
            el: cell,
            locked: false,
            letter: cell.dataset.letter,
          };
        });

        updateHud();
        schedulePoop(650);
      }

      function charsForStage() {
        if (stage === 1) {
          return Array.from(sentence);
        }

        const compact = sentence.replace(/\s/g, "");
        return Array.from({ length: stage }, () => compact).join("").split("");
      }

      function sizeForStage(totalCells) {
        const desiredSize = stage === 1 ? stageOneSize() : cellSize;
        const minSize = 6;

        for (let size = desiredSize; size >= minSize; size -= 1) {
          const cols = Math.max(1, Math.floor(window.innerWidth / size));
          const rows = Math.ceil(totalCells / cols);

          if (rows * size <= window.innerHeight) {
            return size;
          }
        }

        return minSize;
      }

      function schedulePoop(delay = randomBetween(900, 1900)) {
        clearTimeout(spawnTimer);
        spawnTimer = setTimeout(spawnPoop, delay);
      }

      function spawnPoop() {
        const available = cells
          .map((cell, index) => (cell.locked ? -1 : index))
          .filter((index) => index >= 0);

        if (!available.length) {
          finishStage();
          return;
        }

        hotIndex = available[Math.floor(Math.random() * available.length)];
        const cell = cells[hotIndex];
        cell.el.classList.add("hot");
        cell.el.textContent = "💩";

        clearTimeout(revertTimer);
        revertTimer = setTimeout(revertHotCell, randomBetween(850, 1450));
      }

      function revertHotCell() {
        if (hotIndex < 0) {
          return;
        }

        const cell = cells[hotIndex];
        if (!cell.locked) {
          cell.el.classList.remove("hot");
          cell.el.textContent = cell.letter;
        }

        hotIndex = -1;
        schedulePoop();
      }

      function claimCell(event) {
        if (isBetweenStages) {
          return;
        }

        const index = Number(event.currentTarget.dataset.index);
        if (index !== hotIndex || cells[index].locked) {
          playFart();
          return;
        }

        clearTimeout(revertTimer);
        cells[index].locked = true;
        cells[index].el.classList.remove("hot");
        cells[index].el.classList.add("locked");
        cells[index].el.textContent = "💩";
        hotIndex = -1;
        playDrip();
        updateHud();

        if (cells.every((cell) => cell.locked)) {
          finishStage();
          return;
        }

        schedulePoop(randomBetween(280, 900));
      }

      function finishStage() {
        clearTimeout(spawnTimer);
        clearTimeout(revertTimer);
        isBetweenStages = true;
        hotIndex = -1;
        breakOverlay.classList.remove("hidden");
        stage += 1;
        cellSize = stage === 2 ? stageTwoSize() : Math.max(6, Math.floor(cellSize * 0.82));
        window.setTimeout(() => {
          breakOverlay.classList.add("hidden");
          isBetweenStages = false;
          buildStage();
        }, 5000);
      }

      function updateHud() {
        const locked = cells.filter((cell) => cell.locked).length;
        stageLabel.textContent = `stage ${stage}`;
        progressLabel.textContent = `${locked} / ${cells.length}`;
      }

      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function playDrip() {
        dripSound.currentTime = 0;
        dripSound.play().catch(() => {});
      }

      function playFart() {
        fartSound.currentTime = 0;
        fartSound.play().catch(() => {});
      }

      window.addEventListener("resize", () => {
        if (isBetweenStages) {
          return;
        }

        buildStage();
      });

      buildStage();
    </script>
  </body>
</html>
