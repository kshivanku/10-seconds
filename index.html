<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ten Seconds Game</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #fe7141;
        color: #111111;
        font-family: Impact, Haettenschweiler, "Arial Black", "Franklin Gothic Heavy", sans-serif;
        user-select: none;
      }

      .board {
        --cell-size: 84px;
        position: fixed;
        inset: 0;
        width: var(--viewport-width, 100dvw);
        height: var(--viewport-height, 100dvh);
        overflow: hidden;
        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cell-size));
        grid-template-rows: repeat(var(--rows), var(--cell-size));
        justify-content: center;
        align-content: center;
        background: #fe7141;
      }

      .cell {
        appearance: none;
        width: var(--cell-size);
        height: var(--cell-size);
        margin: 0;
        padding: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 0;
        background: #fe7141;
        color: #111111;
        cursor: default;
        font-size: calc(var(--cell-size) * 1.38);
        font-weight: 900;
        line-height: 1;
        text-transform: uppercase;
        touch-action: manipulation;
      }

      .glyph {
        display: block;
        line-height: 0.78;
        transform-origin: center;
        animation: glyph-spin var(--spin-speed, 4600ms) cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }

      .poop {
        display: block;
        width: calc(var(--cell-size) * var(--poop-scale, 0.88));
        height: calc(var(--cell-size) * var(--poop-scale, 0.88));
        object-fit: contain;
        transform-origin: center;
        animation: glyph-spin var(--spin-speed, 4600ms) cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }

      @keyframes glyph-spin {
        from {
          transform: rotate(var(--start-rotation, 0deg)) scale(1.18);
        }

        to {
          transform: rotate(calc(var(--start-rotation, 0deg) + var(--spin-direction, 1) * 360deg)) scale(1.18);
        }
      }

      .cell.hot {
        cursor: pointer;
        background: #111111;
        color: #fe7141;
        font-size: calc(var(--cell-size) * 0.72);
        transform: scale(1.06);
        z-index: 1;
      }

      .cell.tutorial {
        animation: tutorial-blink 520ms steps(1, end) infinite;
      }

      @keyframes tutorial-blink {
        0%,
        100% {
          background: #111111;
          color: #fe7141;
        }

        50% {
          background: #fe7141;
          color: #111111;
        }
      }

      .cell.locked {
        background: #fe7141;
        color: #111111;
        font-size: calc(var(--cell-size) * 0.68);
      }

      .cell.blank {
        color: transparent;
      }

      .cell.blank.hot,
      .cell.blank.locked {
        color: #111111;
      }

      .hud {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: rgba(17, 17, 17, 0.62);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        pointer-events: none;
        text-transform: uppercase;
      }

      .break-overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        overflow: hidden;
        pointer-events: none;
      }

      .break-overlay.hidden {
        display: none;
      }

      .break-mover,
      .trail-text {
        position: absolute;
        left: 0;
        top: 0;
        width: max-content;
        max-width: 92dvw;
        font-size: var(--break-font-size, clamp(2.8rem, 8.6vw, 10rem));
        font-weight: 1000;
        line-height: 0.78;
        white-space: nowrap;
        text-transform: uppercase;
      }

      .break-mover {
        z-index: 2;
        color: #111111;
        filter: drop-shadow(0 3px 0 rgba(254, 113, 65, 0.85));
      }

      .trail-text {
        color: #ffffff;
        opacity: 1;
        transform: translate(var(--x), var(--y));
        -webkit-text-stroke: clamp(3px, 0.7vw, 9px) #111111;
        paint-order: stroke fill;
        text-shadow:
          4px 4px 0 #111111,
          -2px 4px 0 #111111,
          4px -2px 0 #111111,
          -2px -2px 0 #111111;
      }

      @media (max-width: 640px) {
        .board {
          --cell-size: 64px;
        }

        .hud {
          font-size: 10px;
        }

      }
    </style>
  </head>
  <body>
    <main class="board" id="board" aria-label="Tap temporary poop images before they turn back"></main>
    <div class="hud" aria-hidden="true">
      <span id="stage">stage 1</span>
      <span id="progress">0 / 0</span>
    </div>
    <div class="break-overlay hidden" id="breakOverlay" aria-hidden="true">
      <div id="trailLayer"></div>
      <div class="break-mover" id="breakMover">What takes 10 seconds?</div>
    </div>

    <script>
      const sentence = "That took 10 seconds to create.";
      const board = document.querySelector("#board");
      const breakOverlay = document.querySelector("#breakOverlay");
      const breakMover = document.querySelector("#breakMover");
      const trailLayer = document.querySelector("#trailLayer");
      const stageLabel = document.querySelector("#stage");
      const progressLabel = document.querySelector("#progress");
      const fartSound = new Audio("assets/fart.mp3");
      const dripSound = new Audio("assets/drip.mp3");
      let stage = 1;
      let cells = [];
      let hotIndex = -1;
      let spawnTimer = 0;
      let revertTimer = 0;
      let isBetweenStages = false;
      let breakAnimationFrame = 0;
      let breakTrailTimer = 0;
      let tutorialTargetsRemaining = 2;

      function buildStage() {
        clearTimeout(spawnTimer);
        clearTimeout(revertTimer);
        hotIndex = -1;

        const viewport = visibleViewport();
        const stageChars = charsForStage();
        const stageCellSize = sizeForStage(stageChars.length);
        const cols = Math.max(1, Math.floor(viewport.width / stageCellSize));
        const rows = Math.ceil(stageChars.length / cols);

        board.style.setProperty("--viewport-width", `${viewport.width}px`);
        board.style.setProperty("--viewport-height", `${viewport.height}px`);
        board.style.setProperty("--cell-size", `${stageCellSize}px`);
        board.style.setProperty("--cols", cols);
        board.style.setProperty("--rows", rows);
        board.replaceChildren();

        cells = stageChars.map((character, index) => {
          const cell = document.createElement("button");
          cell.className = "cell";
          cell.type = "button";
          cell.dataset.index = String(index);
          cell.dataset.letter = character;
          cell.style.setProperty("--start-rotation", `${((index * 47) % 180) - 90}deg`);
          cell.style.setProperty("--spin-speed", `${3200 + (index % 7) * 520}ms`);
          cell.style.setProperty("--spin-direction", index % 2 === 0 ? 1 : -1);
          cell.style.setProperty("--poop-scale", (0.52 + Math.random() * 0.72).toFixed(2));
          cell.classList.toggle("blank", character === " ");
          renderCellLetter(cell, character);
          cell.addEventListener("pointerdown", claimCell);
          board.append(cell);
          return {
            el: cell,
            locked: false,
            letter: cell.dataset.letter,
          };
        });

        updateHud();
        schedulePoop(650);
      }

      function charsForStage() {
        if (stage === 1) {
          return Array.from(sentence);
        }

        const compact = sentence.replace(/\s/g, "");
        return Array.from({ length: stage }, () => compact).join("").split("");
      }

      function renderCellLetter(cell, character) {
        cell.replaceChildren();

        if (character === " ") {
          return;
        }

        const glyph = document.createElement("span");
        glyph.className = "glyph";
        glyph.textContent = character;
        cell.append(glyph);
      }

      function renderPoop(cell) {
        cell.replaceChildren();
        const poop = document.createElement("img");
        poop.className = "poop";
        poop.src = "assets/poop.png";
        poop.alt = "";
        poop.draggable = false;
        cell.append(poop);
      }

      function sizeForStage(totalCells) {
        const minSize = 1;
        const { width: viewportWidth, height: viewportHeight } = visibleViewport();
        const largestPossible = Math.floor(Math.min(viewportWidth, viewportHeight));

        for (let size = largestPossible; size >= minSize; size -= 1) {
          const cols = Math.max(1, Math.floor(viewportWidth / size));
          const rows = Math.ceil(totalCells / cols);

          if (rows * size <= viewportHeight) {
            return size;
          }
        }

        return minSize;
      }

      function visibleViewport() {
        const viewport = window.visualViewport;
        return {
          width: Math.floor(viewport?.width || window.innerWidth),
          height: Math.floor(viewport?.height || window.innerHeight),
        };
      }

      function schedulePoop(delay = randomBetween(900, 1900)) {
        clearTimeout(spawnTimer);
        spawnTimer = setTimeout(spawnPoop, delay);
      }

      function spawnPoop() {
        const available = cells
          .map((cell, index) => (cell.locked || cell.letter === " " ? -1 : index))
          .filter((index) => index >= 0);

        if (!available.length) {
          finishStage();
          return;
        }

        hotIndex = available[Math.floor(Math.random() * available.length)];
        const cell = cells[hotIndex];
        cell.el.classList.add("hot");
        renderPoop(cell.el);

        clearTimeout(revertTimer);
        if (tutorialTargetsRemaining > 0) {
          cell.el.classList.add("tutorial");
          return;
        }

        revertTimer = setTimeout(revertHotCell, randomBetween(850, 1450));
      }

      function revertHotCell() {
        if (hotIndex < 0) {
          return;
        }

        const cell = cells[hotIndex];
        if (!cell.locked) {
          cell.el.classList.remove("hot");
          renderCellLetter(cell.el, cell.letter);
        }

        hotIndex = -1;
        schedulePoop();
      }

      function claimCell(event) {
        if (isBetweenStages) {
          return;
        }

        const index = Number(event.currentTarget.dataset.index);
        if (index !== hotIndex || cells[index].locked) {
          playFart();
          return;
        }

        clearTimeout(revertTimer);
        cells[index].locked = true;
        cells[index].el.classList.remove("hot", "tutorial");
        cells[index].el.classList.add("locked");
        renderPoop(cells[index].el);
        hotIndex = -1;
        playDrip();
        updateHud();

        if (isStageComplete()) {
          finishStage();
          return;
        }

        if (tutorialTargetsRemaining > 0) {
          tutorialTargetsRemaining -= 1;
          schedulePoop(tutorialTargetsRemaining > 0 ? 500 : randomBetween(900, 1900));
          return;
        }

        schedulePoop(randomBetween(280, 900));
      }

      function finishStage() {
        clearTimeout(spawnTimer);
        clearTimeout(revertTimer);
        isBetweenStages = true;
        hotIndex = -1;
        breakOverlay.classList.remove("hidden");
        startBreakAnimation();
        stage += 1;
        window.setTimeout(() => {
          stopBreakAnimation();
          breakOverlay.classList.add("hidden");
          isBetweenStages = false;
          buildStage();
        }, 5000);
      }

      function startBreakAnimation() {
        stopBreakAnimation();
        fitBreakText();

        const viewport = visibleViewport();
        const bounds = () => ({
          width: Math.max(1, visibleViewport().width - breakMover.offsetWidth),
          height: Math.max(1, visibleViewport().height - breakMover.offsetHeight),
        });
        let x = randomBetween(0, Math.max(1, viewport.width - breakMover.offsetWidth));
        let y = randomBetween(0, Math.max(1, viewport.height - breakMover.offsetHeight));
        let vx = viewport.width < 700 ? 3.3 : 5.2;
        let vy = viewport.width < 700 ? 2.7 : 4.1;

        const animate = () => {
          const limit = bounds();
          x += vx;
          y += vy;

          if (x <= 0 || x >= limit.width) {
            vx *= -1;
            x = Math.max(0, Math.min(x, limit.width));
          }

          if (y <= 0 || y >= limit.height) {
            vy *= -1;
            y = Math.max(0, Math.min(y, limit.height));
          }

          breakMover.style.transform = `translate(${x}px, ${y}px)`;
          breakAnimationFrame = requestAnimationFrame(animate);
        };

        const stampTrail = () => {
          const trail = document.createElement("div");
          trail.className = "trail-text";
          trail.textContent = "What takes 10 seconds?";
          trail.style.setProperty("--x", `${x}px`);
          trail.style.setProperty("--y", `${y}px`);
          trail.style.setProperty("--break-font-size", getComputedStyle(breakMover).fontSize);
          trailLayer.append(trail);
        };

        breakTrailTimer = window.setInterval(stampTrail, 150);
        stampTrail();
        animate();
      }

      function fitBreakText() {
        breakMover.style.setProperty("--break-font-size", "");
        const availableWidth = visibleViewport().width * 0.92;

        if (breakMover.offsetWidth <= availableWidth) {
          return;
        }

        const currentSize = parseFloat(getComputedStyle(breakMover).fontSize);
        const fittedSize = Math.max(24, Math.floor(currentSize * (availableWidth / breakMover.offsetWidth)));
        breakMover.style.setProperty("--break-font-size", `${fittedSize}px`);
      }

      function stopBreakAnimation() {
        cancelAnimationFrame(breakAnimationFrame);
        clearInterval(breakTrailTimer);
        breakAnimationFrame = 0;
        breakTrailTimer = 0;
        trailLayer.replaceChildren();
      }

      function updateHud() {
        const locked = cells.filter((cell) => cell.locked).length;
        const targetable = cells.filter((cell) => cell.letter !== " ").length;
        stageLabel.textContent = `stage ${stage}`;
        progressLabel.textContent = `${locked} / ${targetable}`;
      }

      function isStageComplete() {
        return cells.every((cell) => cell.letter === " " || cell.locked);
      }

      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function playDrip() {
        dripSound.currentTime = 0;
        dripSound.play().catch(() => {});
      }

      function playFart() {
        fartSound.currentTime = 0;
        fartSound.play().catch(() => {});
      }

      function handleViewportResize() {
        if (isBetweenStages) {
          return;
        }

        buildStage();
      }

      window.addEventListener("resize", handleViewportResize);
      window.visualViewport?.addEventListener("resize", handleViewportResize);

      buildStage();
    </script>
  </body>
</html>
